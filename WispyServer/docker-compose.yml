version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wispymqdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: wispymgdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: unless-stopped

  app:
    build: .
    container_name: wispy-server-local
    depends_on:
      - mysql
      - mongodb
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql_data:
  mongodb_data:

networks:
  app-network:
    driver: bridge
