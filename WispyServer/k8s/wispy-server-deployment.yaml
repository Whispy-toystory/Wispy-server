apiVersion: apps/v1
kind: Deployment
metadata:
  name: wispy-server
  namespace: wispy-server
  labels:
    app: wispy-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wispy-server
  template:
    metadata:
      labels:
        app: wispy-server
    spec:
      containers:
        - name: wispy-server
          image: 990317434218.dkr.ecr.ap-northeast-2.amazonaws.com/wispy-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: wispy-server-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wispy-server-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wispy-server-secrets
                  key: DB_PASSWORD

            - name: MONGODB_NAME
              valueFrom:
                configMapKeyRef:
                  name: wispy-server-config
                  key: MONGODB_NAME

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wispy-server-secrets
                  key: JWT_SECRET
            - name: JWT_ACCESS_TOKEN_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: wispy-server-config
                  key: JWT_ACCESS_TOKEN_EXPIRATION
            - name: JWT_REFRESH_TOKEN_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: wispy-server-config
                  key: JWT_REFRESH_TOKEN_EXPIRATION

            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: wispy-server-config
                  key: AWS_S3_BUCKET_NAME
            - name: AWS_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: wispy-server-config
                  key: AWS_S3_REGION

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: wispy-server-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: wispy-server-secrets
                  key: AWS_SECRET_ACCESS_KEY

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: wispy-server-service
  namespace: wispy-server
  labels:
    app: wispy-server
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: wispy-server
