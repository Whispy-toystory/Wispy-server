apiVersion: v1
kind: Service
metadata:
  name: wispy-server-service
  namespace: default
  labels:
    app: wispy-server
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: wispy-server
---
apiVersion: v1
kind: Service
metadata:
  name: wispy-server-internal
  namespace: default
  labels:
    app: wispy-server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: wispy-server