apiVersion: apps/v1
kind: Deployment
metadata:
  name: wispy-server
  namespace: default
  labels:
    app: wispy-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wispy-server
  template:
    metadata:
      labels:
        app: wispy-server
    spec:
      serviceAccountName: wispy-server-sa
      containers:
        - name: wispy-server
          image: 990317434218.dkr.ecr.ap-northeast-2.amazonaws.com/wispy-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5