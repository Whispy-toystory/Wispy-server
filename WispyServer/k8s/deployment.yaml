apiVersion: apps/v1
kind: Deployment
metadata:
  name: wispymq-api
  namespace: default
  labels:
    app: wispymq-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wispymq-api
  template:
    metadata:
      labels:
        app: wispymq-api
    spec:
      containers:
        - name: wispymq-api
          image: 990317434218.dkr.ecr.ap-northeast-2.amazonaws.com/wispymq-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: wispymq-app-secret
                  key: AWS_REGION
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: wispymq-app-secret
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wispymq-app-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wispymq-app-secret
                  key: DB_PASSWORD
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: wispymq-app-secret
                  key: MONGO_URI
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # 헬스체크는 일단 주석 처리 (나중에 추가)
          # readinessProbe:
          #   tcpSocket:
          #     port: 8080
          #   initialDelaySeconds: 60
          #   periodSeconds: 10
          # livenessProbe:
          #   tcpSocket:
          #     port: 8080
          #   initialDelaySeconds: 90
          #   periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: wispymq-api-service
  namespace: default
spec:
  selector:
    app: wispymq-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP